services:
  - type: web
    name: nafcol-backend
    env: node
    buildCommand: cd nafcol-backend && npm install && npm run build
    startCommand: cd nafcol-backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: nafcol-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: nafcol-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://nafcol-backend.onrender.com" # Update if backend name changes

databases:
  - name: nafcol-db
    databaseName: nafcol
    user: nafcol
    plan: free
